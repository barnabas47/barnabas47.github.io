{% assign lang = page.lang | default: "hu" %}
{% assign t = site.data.locales[lang] %}
<!-- Navigation -->
<nav class="modern-navbar" id="main-nav">
  <div class="nav-container">
    <a class="nav-brand" href="#page-top">
      <span class="brand-badge"><i class="fa-solid fa-code"></i></span>
      <span class="brand-name">Buzás Barnabás</span>
    </a>

    <div class="nav-menu" id="nav-menu">
      <a class="nav-link" href="#portfolio"><i class="fa-solid fa-layer-group"></i> {{ t.nav_projects }}</a>
      <a class="nav-link" href="#experience"><i class="fa-solid fa-briefcase"></i> {{ t.nav_experience }}</a>
      <a class="nav-link" href="#about"><i class="fa-solid fa-user"></i> {{ t.nav_about }}</a>
      <a class="nav-link" href="#contact"><i class="fa-solid fa-paper-plane"></i> {{ t.nav_contact }}</a>

      <!-- Language Switcher Pill -->
      <div class="lang-switch-container">
        {% if lang == 'hu' %}
          <a href="{{ "/en/" | relative_url }}" class="lang-btn" title="Switch to English">
            <span class="lang-flag">🇺🇸</span> EN
          </a>
        {% else %}
          <a href="{{ "/" | relative_url }}" class="lang-btn" title="Váltás Magyar nyelvre">
            <span class="lang-flag">🇭🇺</span> HU
          </a>
        {% endif %}
      </div>
    </div>

    <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
</nav>
