{% assign lang = page.lang | default: "hu" %}
{% assign t = site.data.locales[lang] %}
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ t.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="{{ t.description }}">
  <meta name="keywords" content="{{ t.keywords }}">
  <meta name="author" content="{{ t.title }}">
  <meta name="theme-color" content="#0B0F19">

  <!-- OpenGraph / Social Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ t.title }}">
  <meta property="og:description" content="{{ t.description }}">
  <meta property="og:url" content="{{ site.url }}">
  <meta property="og:image" content="{{ "/img/portfolio/omniclaim.png" | relative_url }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.url }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B0F19'/><circle cx='16' cy='16' r='10' fill='%236366F1'/><path d='M11 16L15 20L21 12' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Inter & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Pro CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Modern Glassmorphism & Bento Grid CSS -->
  <link rel="stylesheet" href="{{ "/style.css" | relative_url }}?v=10">
</head>
